services:
  aetherdesk:
    build: .
    image: aetherdesk:latest
    container_name: aetherdesk
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      # Uncomment to require Bearer token on dangerous APIs:
      # AETHER_TOKEN: "change-me"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
